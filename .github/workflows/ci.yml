name: Desktop and server CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Windows desktop tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: application
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            application/requirements.txt
            application/requirements-dev.txt
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint desktop sources and tests
        run: python -m ruff check src tests packaging
      - name: Desktop regression suite
        run: python -m pytest tests --ignore=tests/server --junitxml=outputs/desktop-tests.xml
      - name: No-key agent acceptance journey
        run: python tools/demo_life_agent.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results
          path: application/outputs/desktop-tests.xml
          if-no-files-found: ignore

  server:
    name: Linux server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: application
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: application/requirements-server.txt
      - name: Install server dependencies
        run: python -m pip install -r requirements-server.txt
      - name: Server regression suite
        run: python -m pytest tests/server --junitxml=outputs/server-tests.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: application/outputs/server-tests.xml
          if-no-files-found: ignore
