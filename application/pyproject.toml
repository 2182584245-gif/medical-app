[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "health-life-service-platform"
version = "1.2.0"
description = "A portable local-first health-life service desktop app with pluggable AI providers."
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6==6.11.2",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "ollama==0.6.2",
    "vosk==0.3.45",
    "pypdf==6.17.0",
    "rapidocr==3.9.2",
    "onnxruntime==1.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "ruff==0.16.5",
    "pyinstaller==6.22.2",
]

[project.scripts]
health-life-service-platform = "ollama_chat_app.main:main"
ollama-dual-chat = "ollama_chat_app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
